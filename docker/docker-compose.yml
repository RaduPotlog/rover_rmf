# Open-RMF managing Rover A1 over VDA 5050 / MQTT (see ../README.md).
#
#   docker compose -f docker/docker-compose.yml up --build            # Gazebo rover
#   RMF_SITE=lab RMF_BROKER_HOST=192.168.1.201 \
#     docker compose -f docker/docker-compose.yml up -d --build        # real rover, site 'lab'
#
# RMF_SITE picks rover_rmf_maps/maps/<site>/ and config/fleet_<site>.yaml (real sites come from
# scripts/import_rover_map.py; the image must be rebuilt after importing). RMF_BROKER_HOST/PORT
# pick the MQTT broker the rover's connector uses: this stack's mosquitto for the simulated rover,
# the rover's own broker for the real one.
#
# Dashboard http://localhost:3000, api-server :8010, MQTT broker for the rover on host :1884
# (:1884 because the host may run its own mosquitto on 1883). All ROS traffic stays on this
# compose network (rmw_cyclonedds_cpp), apart from the rover's ROS 2 Lyrical graph.
#
# The api-server is published on RMF_API_PORT (default 8010), not upstream's 8000: a Windows
# service (Manager.exe) holds 0.0.0.0:8000 on this box, Docker Desktop then silently publishes
# nothing and the dashboard's login goes to that service. The dashboard image is rebuilt with
# the same port (Dockerfile.dashboard). Inside this network RMF still uses api-server:8000.
name: rover-rmf

services:
  mosquitto:
    image: docker.io/library/eclipse-mosquitto:2
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1884:1883"
    restart: unless-stopped

  api-server:
    image: ghcr.io/open-rmf/rmf-web/api-server:jazzy-nightly
    environment:
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      RMF_API_SERVER_CONFIG: /config/api_server_config.py
      RMF_API_PUBLIC_URL: http://localhost:${RMF_API_PORT:-8010}
    volumes:
      - ./api_server_config.py:/config/api_server_config.py:ro
    ports:
      - "${RMF_API_PORT:-8010}:8000"
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
      args:
        API_URL: http://localhost:${RMF_API_PORT:-8010}
    image: rover-rmf-dashboard:jazzy
    ports:
      - "3000:3000"
    restart: unless-stopped

  rmf:
    build:
      context: ..
      dockerfile: docker/Dockerfile.rmf
    image: rover-rmf:jazzy
    depends_on:
      - mosquitto
      - api-server
    command:
      - ros2
      - launch
      - rover_rmf_bringup
      - rover_rmf.launch.xml
      - site:=${RMF_SITE:-rover_world}
      - server_uri:=ws://api-server:8000/_internal
      - broker_host:=${RMF_BROKER_HOST:-mosquitto}
      - broker_port:=${RMF_BROKER_PORT:-1883}
    ports:
      - "8006:8006"   # schedule/trajectory websocket used by the dashboard's map
    restart: unless-stopped
