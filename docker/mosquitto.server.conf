# Fleet broker for the server deployment (docker-compose.server.yml): logins + ACL, retained
# messages (connection, factsheet) survive a restart. Reached over WireGuard only, no TLS.
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
persistence true
persistence_location /mosquitto/data/
log_dest stdout
