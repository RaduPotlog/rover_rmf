# Fleet-side MQTT broker for the RMF <-> rover VDA 5050 link (like
# rover_vda5050_bringup/config/mosquitto.conf): anonymous, no persistence, LAN/dev only.
listener 1883
allow_anonymous true
persistence false
log_dest stdout
